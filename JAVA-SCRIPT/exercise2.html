    <script>
      //WAP for the grading
      let marks = prompt("Enter the Marks");
      if (marks >= 80 && marks <= 100) {
        console.log("Grade A");
      } else if (marks >= 70 && marks < 80) {
        console.log("Grade B");
      } else if (marks >= 60 && marks < 70) {
        console.log("Grade C");
      } else if (marks >= 50 && marks < 60) {
        console.log("Grade D");
      } else if (marks < 50) {
        console.log("Grade F");
      } else {
        console.log("Invalid Marks.\nMarks is out of 100.");
      }
    </script>
