<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Netflix clone</title>
    <link rel="stylesheet" href="netflixclone.css" />
  </head>
  <body>
    <div class="nav1">🎁 New to Netflix? Try 14 days for ₹0</div>
    <div class="main">
      <div class="box">
        <nav>
          <span
            ><img src="assets/images/netflix logo.svg" width="150px" alt=""
          /></span>
          <div class="navbutton">
            <button class="navbutton1">English</button>
            <button class="navbutton2">sign in</button>
          </div>
        </nav>
        <div class="content">
          <div>Unlimited movies,</div>
          <div>shows, and more</div>
          <p>Plans start at ₹149. Cancel anytime.</p>
          <p>Ready to watch? Enter your email to start your membership.</p>
        </div>
        <div class="subs">
          <form action="post">
            <label for="email"></label>
            <input type="email" id="email" placeholder="Email Address" />
          </form>
          <button class="button3">Try 14 days for ₹0</button>
        </div>
        <div class="line">
          <p>New members only. Terms below.</p>
        </div>
      </div>
    </div>
  </body>
</html>
